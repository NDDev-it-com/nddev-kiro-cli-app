rules:
  - capability: fs_read
    effect: deny
    match:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "secrets/**"
  - capability: fs_read
    effect: allow
  - capability: shell
    effect: allow
    match:
      - "git status*"
      - "git diff*"
      - "git log*"
      - "git branch*"
      - "python3 -m unittest*"
      - "python3 -m pytest*"
      - "npm test*"
      - "npm run test*"
  - capability: fs_write
    effect: ask
  - capability: web_fetch
    effect: ask
  - capability: web_search
    effect: ask
  - capability: mcp
    effect: ask
  - capability: subagent
    effect: allow
  - capability: skill
    effect: allow
  - capability: diagnostics
    effect: allow
  - capability: context
    effect: allow
